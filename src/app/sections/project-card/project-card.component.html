<article class="card">
  <h3>{{ project().title }}</h3>
  <p>{{ project().description }}</p>
  <app-tag-list [tags]="project().stack" />

  <div class="actions">
    <a class="btn btn--sm" [href]="project().repoUrl" target="_blank" rel="noopener"
       [attr.aria-label]="'Ver ' + project().title + ' no GitHub'">
      Ver no GitHub
    </a>

    @if (project().liveUrl; as url) {
      <a class="btn btn--sm btn--ghost" [href]="url" target="_blank" rel="noopener"
         [attr.aria-label]="'Ver ' + project().title + ' online'">
        Ver online
      </a>
    }
  </div>
</article>
